name: NESCO Low Balance Alert

on:
  schedule:
    - cron: "37 10 * * 2,6"   # 4 PM Bangladesh (UTC+6)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # playwright install

      - name: Run NESCO balance checker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ID1: ${{ secrets.ID1 }}
          ID2: ${{ secrets.ID2 }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: python nesco.py